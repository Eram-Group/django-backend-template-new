[project]
name = "backend-infra"
version = "0.1.0"
description = "AWS CDK app for the backend template (ECS Express Mode web, Fargate worker, RDS, S3/CloudFront, EventBridge Scheduler)."
requires-python = ">=3.14"
dependencies = [
  "aws-cdk-lib>=2.267.0",
  "constructs>=10.5,<11",
]

[dependency-groups]
dev = [
  "cfn-lint>=1.55.1",
  "pytest>=9.0",
]

[tool.pytest]
testpaths = ["tests"]

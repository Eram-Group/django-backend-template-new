volumes:
  local_postgres_data: {}

services:
  postgres:
    image: postgres:18
    container_name: local_postgres
    volumes:
      # PG18 image moved its data dir - mount the versioned path
      - local_postgres_data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d backend']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: local_mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

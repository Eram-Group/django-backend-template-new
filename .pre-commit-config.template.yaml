# Hygiene for the TEMPLATE repo itself - install with
# `uv run pre-commit install -c .pre-commit-config.template.yaml` (the default
# name would collide with the rendered .pre-commit-config.yaml.jinja, and
# Copier excludes by destination path). The real gates - ruff,
# mypy, pytest, import-linter, CDK - run on the generated presets in
# .github/workflows/template.yml, because the rendered files only exist there.
exclude: '/migrations/|\.jinja$'
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        files: ^\.github/workflows/template\.yml$

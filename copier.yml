# Copier template definition - `uvx copier copy gh:Eram-Group/backend-template <dir>`.
#
# Only files ending in `.jinja` are rendered (and lose the suffix); everything
# else is copied byte-for-byte. Directory names are always rendered, which is
# how `apps/{% if database == 'postgis' %}zones{% endif %}/` disappears from a
# plain-Postgres project. docs/TEMPLATE.md is the how-to for template work.

_min_copier_version: "9.17.0"
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Replaces Copier's default list, so the defaults are repeated here.
_exclude:
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  # Template-only material (README.md is the template's; README.md.jinja the project's)
  - README.md
  - presets
  - build
  - .github/workflows/template.yml
  - docs/TEMPLATE.md
  - PLAN.md
  - TODO.json
  # Never part of a fresh project (local state of the template checkout)
  - .env
  - .claude
  - .idea
  - .venv
  - .mypy_cache
  - .ruff_cache
  - .pytest_cache
  - .import_linter_cache
  - .coverage
  - openapi.json
  - media
  - "*.mo"
  - infra/.venv
  - infra/cdk.out
  - infra/node_modules

_message_after_copy: |

  {{ project_name }} is generated in {{ _copier_conf.dst_path }}.

  Next:
    cd {{ _copier_conf.dst_path }}
    git init -b main && git add -A && git commit -m "chore: generate from backend-template"
    just bootstrap        # deps, .env, git hooks, postgres + mailpit, migrate
    $EDITOR config/branding.py   # BRAND_COLOR + SITE_SYMBOL (admin + emails)
    just gates            # every CI gate, locally

  Then work through docs/NEW_PROJECT.md (GitHub variables, optional modules,
  first deploy). Pull later template improvements with `uvx copier update`.

# --- Identity -----------------------------------------------------------------

project_name:
  type: str
  help: Product name - admin header and title, API title, email branding, OTP subject prefix
  placeholder: Eram Rides
  validator: "{% if not project_name.strip() %}Required.{% endif %}"

app_name:
  type: str
  help: Slug that prefixes every AWS resource (stacks, ECR eram/<slug>, bucket eram-<slug>-<env>, secret <env>/<slug>)
  default: "{{ project_name | trim | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (app_name | regex_search('^[a-z][a-z0-9-]{1,30}$')) %}
    Lowercase letters, digits and dashes, starting with a letter, 2-31 characters.
    {% endif %}

github_repo:
  type: str
  help: GitHub repository (org/name) - scopes the OIDC deploy role trust
  default: "Eram-Group/{{ app_name }}"
  validator: >-
    {% if not (github_repo | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')) %}
    Use the org/name form.
    {% endif %}

domain:
  type: str
  help: Product domain inside the company hosted zone - API at api.<domain>, dev at dev.<domain>
  default: "{{ app_name }}.eramapps.com"
  validator: >-
    {% if not (domain | regex_search('^[a-z0-9-]+(\\.[a-z0-9-]+)*\\.eramapps\\.com$')) %}
    Must be a subdomain of eramapps.com (the only hosted zone the account owns).
    {% endif %}

# --- Database -------------------------------------------------------------------

database:
  type: str
  help: PostGIS adds GeoDjango (GDAL/GEOS on every host and in the image) and the zones app (service areas as polygons)
  default: postgres
  choices:
    PostgreSQL: postgres
    PostGIS: postgis

# --- Defaults ------------------------------------------------------------------

default_from_email:
  type: str
  help: Sender of every deployed email - must be on the verified SES identity
  default: no-reply@eramapps.com
  validator: >-
    {% if not (default_from_email | regex_search('^[^@\\s]+@eramapps\\.com$')) %}
    Must be an @eramapps.com address (the verified SES identity).
    {% endif %}

superuser_email:
  type: str
  help: Deployed superuser login (createsu); the password lives in Secrets Manager
  default: admin@eramapps.com
  validator: >-
    {% if not (superuser_email | regex_search('^[^@\\s]+@[^@\\s]+\\.[a-z]+$')) %}
    Not an email address.
    {% endif %}

timezone:
  type: str
  help: Team timezone for Dependabot's update window
  default: Asia/Riyadh

name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Everything host-runnable, mirroring the local gates exactly.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
    services:
      postgres:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Exact pin: astral-sh stopped publishing floating major tags after
      # `v7`, so `@v10` is unresolvable. Dependabot's github-actions
      # ecosystem keeps this current.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: extractions/setup-just@v3

      - name: Install environment
        run: uv sync --locked

      # GeoDjango loads GDAL/GEOS through ctypes on the runner host (pytest
      # runs outside Docker here); the image job gets them from the Dockerfile.
      - name: Install GDAL and GEOS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev

      # Env has no code defaults by design - the example IS the CI config.
      - name: Bootstrap env file
        run: cp .env.example .env

      # The gate list lives in the justfile (`just gates`), so local runs, this
      # job and the template's generated-project CI stay identical.
      - name: Gates (lint, mypy, lockfile, migrations, tests, OpenAPI)
        run: just gates

  # CDK app: synth without credentials, template assertions, cfn-lint.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - uses: extractions/setup-just@v3

      - name: Install (uv + pinned CDK CLI)
        run: |
          uv sync --locked
          npm ci

      - name: Gates (synth, template assertions, cfn-lint)
        run: just infra-gates

  # Prod-image build + boot with the production settings module: the release
  # step, then the web process answering its probes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: imresamu/postgis:18-3.6
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deployed-only fields point at nothing reachable: the release step
      # and the probes never touch S3/SES/Sentry. Later lines override the
      # example values.
      - name: Image env file
        run: |
          cp .env.example .env.image
          cat >> .env.image <<EOF
          ENVIRONMENT=dev
          SECRET_KEY=ci-only-not-a-secret-nZfK3vQ8wLxT1pYbR6mJc9GhD4sE7uAiO2
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/backend
          ALLOWED_HOSTS=localhost
          AWS_STORAGE_BUCKET_NAME=ci-unused
          AWS_S3_REGION_NAME=eu-central-1
          AWS_S3_CUSTOM_DOMAIN=ci-unused.cloudfront.net
          AWS_SES_REGION=eu-central-1
          SENTRY_DSN=https://key@sentry.invalid/1
          SENTRY_RELEASE=${{ github.sha }}
          GDAL_LIBRARY_PATH=
          GEOS_LIBRARY_PATH=
          EOF

      - name: Release step (deploy checklist + migrate + cache table)
        run: >-
          docker run --rm --network host --env-file .env.image backend:local
          sh -c "python manage.py check --deploy --fail-level WARNING
          && python manage.py migrate --noinput
          && python manage.py createcachetable"

      - name: Boot web + smoke
        run: |
          docker run -d --name web --network host --env-file .env.image backend:local
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          echo "smoke OK"

      - name: Web logs
        if: failure()
        run: docker logs web

name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Everything host-runnable, mirroring the local gates exactly.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Exact pin: astral-sh stopped publishing floating major tags after
      # `v7`, so `@v10` is unresolvable. Dependabot's github-actions
      # ecosystem keeps this current.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install environment
        run: uv sync --locked

      # Env has no code defaults by design - the example IS the CI config.
      - name: Bootstrap env file
        run: cp .env.example .env

      - name: Lint (pre-commit - the single lint source)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Lockfile is current
        run: uv lock --check

      - name: Model changes have migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Tests
        # fail_under comes from [tool.coverage] report.fail_under in pyproject.toml.
        run: uv run pytest -n auto --cov

      # Schema breakage (bad annotation, duplicate operation id) used to
      # surface only post-merge in the Apidog job - generate at PR time.
      - name: OpenAPI schema generates (API + merged auth spec)
        run: |
          uv run manage.py export_openapi_schema --api config.api.v1.api --output openapi.json
          uv run manage.py merge_auth_openapi --input openapi.json --server-url http://localhost:8000

  # CDK app: synth without credentials, template assertions, cfn-lint.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install (uv + pinned CDK CLI)
        run: |
          uv sync --locked
          npm ci

      - name: Synth all stacks
        run: npx cdk synth --all -c image_tag=synth -q

      - name: Template assertions
        run: uv run pytest

      - name: cfn-lint
        run: uv run cfn-lint --ignore-checks W3005 -- cdk.out/*.template.json

  # Prod-image build + boot with the production settings module: the release
  # step, then the web process answering its probes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deployed-only fields point at nothing reachable: the release step
      # and the probes never touch S3/SES/Sentry. Later lines override the
      # example values.
      - name: Image env file
        run: |
          cp .env.example .env.image
          cat >> .env.image <<EOF
          ENVIRONMENT=dev
          SECRET_KEY=ci-only-not-a-secret-nZfK3vQ8wLxT1pYbR6mJc9GhD4sE7uAiO2
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/backend
          ALLOWED_HOSTS=localhost
          AWS_STORAGE_BUCKET_NAME=ci-unused
          AWS_S3_REGION_NAME=eu-central-1
          AWS_S3_CUSTOM_DOMAIN=ci-unused.cloudfront.net
          AWS_SES_REGION=eu-central-1
          SENTRY_DSN=https://key@sentry.invalid/1
          SENTRY_RELEASE=${{ github.sha }}
          EOF

      - name: Release step (deploy checklist + migrate + cache table)
        run: >-
          docker run --rm --network host --env-file .env.image backend:local
          sh -c "python manage.py check --deploy --fail-level WARNING
          && python manage.py migrate --noinput
          && python manage.py createcachetable
          && python manage.py seed_notification_config"

      - name: Boot web + smoke
        run: |
          docker run -d --name web --network host --env-file .env.image backend:local
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          echo "smoke OK"

      - name: Web logs
        if: failure()
        run: docker logs web

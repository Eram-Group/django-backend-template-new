name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Everything host-runnable, mirroring the local gates exactly.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Exact pin: astral-sh publishes no floating `v8` major tag (v7 is the
      # last one), so `@v8` is unresolvable. Renovate's github-actions
      # manager keeps this current.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install environment
        run: uv sync --locked

      # Env has no code defaults by design - the example IS the CI config.
      - name: Bootstrap env file
        run: cp .env.example .env

      - name: Lint (pre-commit - the single lint source)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Lockfile is current
        run: uv lock --check

      - name: Model changes have migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Tests
        # fail_under=80 comes from [tool.coverage.report] in pyproject.toml.
        run: |
          uv run manage.py createcachetable
          uv run pytest -n auto --cov

      # Schema breakage (bad annotation, duplicate operation id) used to
      # surface only post-merge in the Apidog job - generate at PR time.
      - name: OpenAPI schema generates (API + merged auth spec)
        run: |
          uv run manage.py export_openapi_schema --api config.api.v1.api --output openapi.json
          uv run manage.py merge_auth_openapi --input openapi.json

  # Prod-image build + the same smokes the local compose stack passes.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: backend:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bootstrap env file
        run: cp .env.example .env

      - name: Boot stack (release step before web/worker)
        run: |
          docker compose up -d --wait postgres mailpit
          # `compose run` has no --no-build flag (only up/create do); it
          # reuses the loaded backend:local image and builds only if absent.
          docker compose run --rm web python manage.py migrate
          docker compose run --rm web python manage.py createcachetable
          docker compose up -d --wait --no-build

      - name: Smoke
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/readyz
          curl -fsS -o /dev/null http://localhost:8000/_allauth/openapi.json
          echo "smoke OK"

      - name: Stack logs
        if: failure()
        run: docker compose logs

# Merge to main: build the deploy artifact, release-task, roll the dev web
# (ECS Express Mode) and worker services, then sync the OpenAPI spec to Apidog. Each stage skips gracefully
# until its variables exist (AWS_ECR_REPOSITORY / DEV_DEPLOY_ENABLED /
# APIDOG_PROJECT_ID) - the repo stays green with zero infra provisioned.

name: Deploy dev

on:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: read

# Never cancel a mid-flight ECS rollout; GitHub queues one pending run per
# group and supersedes the rest, so the newest sha always deploys next.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # Native arm64 runner: every Fargate task definition is ARM64 (Graviton,
  # ~20% cheaper) and a native build beats QEMU emulation by minutes.
  build:
    if: vars.AWS_ECR_REPOSITORY != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Repo-level sentinel, not the env-scoped cluster var: environment-scoped
    # vars resolve only after a job starts, so they can't gate a job-level if.
    if: vars.DEV_DEPLOY_ENABLED != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Task definitions are created by CDK (infra/); CD only registers a new
      # revision with the new image. Container name "Main" is an ECS Express
      # Mode requirement (never rename). SENTRY_RELEASE = sha, not version:
      # one Sentry release per commit, shared by dev and production.
      - name: Render worker task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_FAMILY_WORKER }}
          container-name: Main
          image: ${{ needs.build.outputs.image }}
          environment-variables: SENTRY_RELEASE=${{ github.sha }}

      # Release task (deploy checklist + migrate + createcachetable +
      # collectstatic) runs on the worker family from this exact new revision
      # - same image AND env as what goes live - and the rollout only starts
      # after it exits 0. The check runs against the real task-definition env
      # (Secrets Manager values included) before any DB mutation;
      # --fail-level WARNING makes "zero warnings" binding. No `service`:
      # the action registers the revision and runs the one-off task only.
      # Always on-demand Fargate, even where the worker service runs on Spot.
      - name: Release task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-container-overrides: >
            [{"name": "Main", "command": ["sh", "-c",
            "python manage.py check --deploy --fail-level WARNING &&
            python manage.py migrate --noinput &&
            python manage.py createcachetable &&
            python manage.py collectstatic --noinput"]}]
          run-task-subnets: ${{ vars.ECS_SUBNETS }}
          run-task-security-groups: ${{ vars.ECS_SECURITY_GROUPS }}
          run-task-assign-public-IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP }}
          wait-for-task-stopped: true
          wait-for-minutes: 12

      - name: Render web task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_FAMILY_WEB }}
          container-name: Main
          image: ${{ needs.build.outputs.image }}
          environment-variables: SENTRY_RELEASE=${{ github.sha }}

      # Register only (no service, no run-task): Express Mode owns the
      # service, so the rollout goes through its own API below.
      - name: Register web task definition
        id: register-web
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}

      # Express Mode rolls out as a canary and auto-rolls back on its 5XX /
      # unhealthy-target alarm. `services-stable` covers the ECS side; the
      # loop then confirms the ACTIVE configuration points at our revision
      # (a rolled-back deploy leaves the old one active -> fail loudly).
      - name: Roll web (ECS Express Mode)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE_ARN: ${{ vars.EXPRESS_SERVICE_ARN }}
          SERVICE_NAME: ${{ vars.EXPRESS_SERVICE_NAME }}
          TASK_DEF_ARN: ${{ steps.register-web.outputs.task-definition-arn }}
          LOG_GROUP: /aws/ecs/${{ vars.ECS_FAMILY_WEB }}
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" --task-definition-arn "$TASK_DEF_ARN" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE_NAME"
          for _ in $(seq 1 60); do
            ACTIVE=$(aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" \
              --query 'service.activeConfigurations[0].taskDefinitionArn' --output text)
            [ "$ACTIVE" = "$TASK_DEF_ARN" ] && { echo "web active on $ACTIVE"; exit 0; }
            sleep 15
          done
          echo "::error::Express rollout did not activate $TASK_DEF_ARN (active: $ACTIVE)"
          aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" || true
          aws logs tail "$LOG_GROUP" --since 15m | tail -n 50 || true
          exit 1

      # Worker rolls only after web is live - the canary + alarm validated the
      # image before the worker moves (expand/contract migrations rely on it).
      - name: Roll worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE_WORKER }}
          wait-for-service-stability: true
          wait-for-minutes: 12

  # Apidog mirrors what runs in dev: sync after a successful deploy. Still
  # runs while deploy is *skipped* pre-infra, never after a failed build or
  # deploy.
  apidog:
    if: ${{ !failure() && !cancelled() && vars.APIDOG_PROJECT_ID != '' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Exact pin - no floating major tag past `v7` upstream (see ci.yml).
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install environment
        run: uv sync --locked

      # Env has no code defaults by design - the example IS the CI config.
      - name: Bootstrap env file
        run: cp .env.example .env

      - name: Export OpenAPI schema
        # --api is required: the instance mounts at /api/v1/, not /api/.
        # The merge folds allauth's auth endpoints (operationIds added,
        # "Authentication /" tags, global Accept-Language) into ONE spec -
        # otherwise the auth API never reaches Apidog.
        run: |
          uv run manage.py export_openapi_schema --api config.api.v1.api --output openapi.json
          uv run manage.py merge_auth_openapi --input openapi.json

      # Code is the source of truth - matching Apidog endpoints get overwritten.
      - name: Sync to Apidog
        env:
          APIDOG_ACCESS_TOKEN: ${{ secrets.APIDOG_ACCESS_TOKEN }}
        run: |
          jq -n --rawfile spec openapi.json \
            '{input: $spec, options: {endpointOverwriteBehavior: "OVERWRITE_EXISTING"}}' \
          | curl -fsS "https://api.apidog.com/v1/projects/${{ vars.APIDOG_PROJECT_ID }}/import-openapi" \
              -H "Authorization: Bearer ${APIDOG_ACCESS_TOKEN}" \
              -H "X-Apidog-Api-Version: 2024-03-28" \
              -H "Content-Type: application/json" \
              --data @-

name: Secret Scan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: secrets-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog (full-history scan)
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          base: ''
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          extra_args: --results=verified,unknown

name: Secret Scan

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: secrets-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `verified` only: fail when a credential is confirmed LIVE against its
      # service. The `unknown` class is unusable here - it permanently flags
      # this repo's documented throwaway dev creds (compose.yaml's
      # postgres:postgres, .env.example's local-only values, the CI image
      # job's sentry.invalid DSN), none of which can ever verify. Excluding those paths instead would blind the scan to real
      # creds pasted into the very config files most likely to receive them.
      - name: TruffleHog (full-history scan)
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          base: ''
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          extra_args: --results=verified

# Main-branch deploy artifact: build + push to ECR tagged with the commit sha.
# Auth is GitHub OIDC (no static AWS keys). Skips gracefully until the repo
# variables exist: AWS_OIDC_ROLE_ARN, AWS_REGION, AWS_ECR_REPOSITORY.

name: Release image

on:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  push-to-ecr:
    if: vars.AWS_ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

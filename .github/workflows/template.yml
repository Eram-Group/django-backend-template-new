# The template's own CI: generate each preset and run the generated project's
# gates on it. `just gates` / `just infra-gates` are the SAME recipes the
# generated ci.yml runs, so the gate list lives once (in the justfile).
name: Template

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: template-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generate:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: postgis
            postgres_image: imresamu/postgis:18-3.6
            image_smoke: true
          - preset: postgres
            postgres_image: postgres:18
            image_smoke: true
          # Every identity/branding answer off its default; gates only.
          - preset: branded
            postgres_image: postgres:18
            image_smoke: false
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      PROJECT: build/${{ matrix.preset }}
    services:
      postgres:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: extractions/setup-just@v3

      - name: Generate ${{ matrix.preset }}
        run: |
          uvx copier@9.17.2 copy --defaults --data-file presets/${{ matrix.preset }}.yml . "$PROJECT"
          cd "$PROJECT"
          git init -q -b main && git add -A   # pre-commit lints tracked files
          cp .env.example .env

      - name: Install GDAL and GEOS
        if: matrix.preset == 'postgis'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev

      - name: App gates (lint, mypy, lockfile, migrations, tests, OpenAPI)
        working-directory: ${{ env.PROJECT }}
        run: |
          uv sync --locked
          just gates

      - name: Infra gates (synth, template assertions, cfn-lint)
        working-directory: ${{ env.PROJECT }}
        run: |
          (cd infra && uv sync --locked && npm ci)
          just infra-gates

      - uses: docker/setup-buildx-action@v4
        if: matrix.image_smoke

      - name: Build image
        if: matrix.image_smoke
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.PROJECT }}
          load: true
          tags: generated:local
          cache-from: type=gha,scope=${{ matrix.preset }}
          cache-to: type=gha,mode=max,scope=${{ matrix.preset }}

      # Same release step + probes the generated ci.yml runs on its image.
      - name: Release step + smoke
        if: matrix.image_smoke
        working-directory: ${{ env.PROJECT }}
        run: |
          cp .env.example .env.image
          cat >> .env.image <<EOF
          ENVIRONMENT=dev
          SECRET_KEY=ci-only-not-a-secret-nZfK3vQ8wLxT1pYbR6mJc9GhD4sE7uAiO2
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/backend
          ALLOWED_HOSTS=localhost
          AWS_STORAGE_BUCKET_NAME=ci-unused
          AWS_S3_REGION_NAME=eu-central-1
          AWS_S3_CUSTOM_DOMAIN=ci-unused.cloudfront.net
          AWS_SES_REGION=eu-central-1
          SENTRY_DSN=https://key@sentry.invalid/1
          SENTRY_RELEASE=${{ github.sha }}
          GDAL_LIBRARY_PATH=
          GEOS_LIBRARY_PATH=
          EOF
          docker run --rm --network host --env-file .env.image generated:local \
            sh -c "python manage.py check --deploy --fail-level WARNING && python manage.py migrate --noinput && python manage.py createcachetable"
          docker run -d --name web --network host --env-file .env.image generated:local
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 2; done
          curl -fsS http://localhost:8000/readyz
          echo "smoke OK"

      - name: Web logs
        if: failure() && matrix.image_smoke
        run: docker logs web || true

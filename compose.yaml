# Local services only: Django runs on the host (`just run` + `just worker`,
# local settings module). The image is built and smoke-tested in CI.

volumes:
  postgres_data: {}

services:
  postgres:
    # PostGIS build of the pinned Postgres major (zones); imresamu publishes the
    # multi-arch build the official postgis/postgis image lacks (no arm64).
    image: imresamu/postgis:18-3.6
    volumes:
      # PG18 image moved its data dir - mount the versioned path
      - postgres_data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d backend']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: docker.io/axllent/mailpit:v1.31.0
    ports:
      - '1025:1025'
      - '8025:8025'

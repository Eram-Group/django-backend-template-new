{% load i18n %}{% get_current_language as LANGUAGE_CODE %}{% get_current_language_bidi as LANGUAGE_BIDI %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{ site_name }}</title>
  <style>
    @media screen and (max-width:600px){
      .w-100{width:100%!important}
      .px-24{padding-left:24px!important;padding-right:24px!important}
    }
    a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important}
  </style>
</head>
<body style="margin:0; padding:0; background:{{ brand.background }}; font-family:Arial,Helvetica,sans-serif;">

  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">{% block preheader %}{% endblock %}</div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:{{ brand.background }};">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="w-100"
               style="max-width:600px; background:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px {{ brand.shadow }};">

          <tr>
            <td style="background:linear-gradient(135deg,{{ brand.gradient_start }},{{ brand.gradient_end }}); padding:24px 40px;" class="px-24">
              <div style="font-size:22px; font-weight:700; color:#ffffff; letter-spacing:1px;">{{ site_name }}</div>
              <div style="font-size:11px; color:{{ brand.tagline }};">{% block tagline %}{% endblock %}</div>
            </td>
          </tr>

          <tr>
            <td style="padding:36px 40px; color:#334155; font-size:15px; line-height:1.6;" class="px-24">
              {% block content %}{% endblock content %}
            </td>
          </tr>

          <tr>
            <td style="background:#f8fafc; border-top:1px solid #e2e8f0; padding:20px 40px;" class="px-24">
              <div style="font-size:12px; color:#94a3b8; line-height:1.5;">
                &copy; {% now "Y" %} {{ site_name }}
              </div>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>

[project]
name = "backend"
version = "0.1.0"
description = "API-only Django backend scaffold"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Eram Dev Team", email = "eramdevteam@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi>=25.1",
  "dj-database-url>=3.1.2",
  "django>=6.0,<6.1",
  "django-allauth[headless-spec,socialaccount]>=65.18",
  "django-anymail[amazon-ses]>=15.0",
  "django-axes>=8.3.1",
  "django-cors-headers>=4.9",
  "django-guid>=3.6.1",
  "django-health-check>=4.4.3",
  "django-phonenumber-field[phonenumbers]>=8.4",
  "django-import-export>=4.4.1",
  "django-modeltranslation>=0.20.3",
  "django-ninja>=1.6.2",
  "django-ratelimit>=4.1.0",
  "django-storages[s3]>=1.14.6",
  "django-structlog>=10.1.0",
  "django-tasks-db>=0.12.0",
  "django-unfold>=0.101.0",
  "firebase-admin>=7.5",
  "gunicorn>=26.0",
  "httpx>=0.28",
  "openpyxl>=3.1.5",
  "psycopg[binary,pool]>=3.3.4",
  "pydantic-settings>=2.14.2",
  "sentry-sdk>=2.66",
  "stamina>=26.1",
]

[dependency-groups]
dev = [
  "coverage>=7.15",
  "django-debug-toolbar>=7.0",
  "django-extensions>=4.1",
  "django-stubs[compatible-mypy]>=6.0.7",
  "django-test-migrations>=1.5.0",
  "django-upgrade>=1.31",
  "factory-boy>=3.3.3",
  "import-linter>=2.13",
  "ipdb>=0.13.13",
  "mimesis>=21",
  "mypy>=2.3",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12",
  "pytest-mock>=3.15.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8.0",
  "respx>=0.23",
  "ruff>=0.15",
  "werkzeug[watchdog]>=3.1.8",
]

# ==== ruff ====
[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
]
lint.select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "DJ",  # flake8-django
  "C4",  # flake8-comprehensions
  "PIE", # flake8-pie
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "DTZ", # flake8-datetimez (naive datetimes)
  "T20", # flake8-print (no stray prints)
  "PT",  # flake8-pytest-style
  "S",   # flake8-bandit (security)
  "TID25", # flake8-tidy-imports banned-api (Faker ban below)
  "A",   # flake8-builtins (no shadowing id/type/...)
  "PTH", # flake8-use-pathlib
  "PERF", # perflint (inefficient loops/copies)
]
lint.ignore = [
  "RUF012", # ClassVar annotations conflict with Django's class-attr idiom (Meta, admin, etc.)
]
# Faker stays installed only because factory_boy imports it eagerly; our code
# must use mimesis via apps/common/tests/fake.py instead.
lint.flake8-tidy-imports.banned-api."faker".msg = "Use mimesis via apps.common.tests.fake - Faker is only factory_boy's internal dependency."
lint.flake8-tidy-imports.banned-api."factory.faker".msg = "Use mimesis via apps.common.tests.fake, not factory.Faker."
lint.per-file-ignores = { "**/tests/**" = [ "S101" ], "conftest.py" = [ "S101" ], "config/settings/*" = [ "F403", "F405" ] }
lint.isort.force-single-line = true

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
strict = true
files = [ "apps", "config", "manage.py" ]
plugins = [
  "mypy_django_plugin.main",
  "pydantic.mypy",
]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
  # Third-party packages without type stubs / py.typed:
  { module = [ "allauth.*", "health_check.*", "django_ratelimit.*", "unfold.*", "import_export.*", "phonenumber_field.*", "firebase_admin.*" ], ignore_missing_imports = true },
  # The framework wraps unfold/import-export (untyped) once; per-entity
  # admins subclass OUR typed classes and need no exemption:
  { module = "apps.common.admin.*", disallow_subclassing_any = false },
  # Adapters subclass allauth's untyped base classes; admin modules may
  # re-register third-party admins whose bases are untyped and use unfold's
  # untyped @action decorator (detail actions):
  { module = [ "apps.*.adapters", "apps.*.admin.*" ], disallow_subclassing_any = false, disallow_untyped_decorators = false },
  # factory-boy declarations are typed but its callables/decorators are not
  # (factories themselves + test modules that call them):
  { module = [ "apps.*.tests.*", "apps.*.tests.*.*" ], disallow_untyped_calls = false, disallow_untyped_decorators = false },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
testpaths = [
  "apps",
  "config",
]
python_files = [
  "tests.py",
  "test_*.py",
]
filterwarnings = [
  # Warnings are errors - deprecations must be dealt with, not scrolled past.
  "error",
  # Upstream django-guid still calls asyncio.iscoroutinefunction (removed in
  # py3.16); drop this ignore once a fixed release ships.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:django_guid",
  # firebase-admin 7.x nudges Message.token toward Message.fid, but client
  # apps register FCM registration TOKENS (FirebaseMessaging.getToken()) -
  # fid targeting is a different identifier. Revisit when mobile SDKs move.
  "ignore:Message.token is deprecated:DeprecationWarning",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "apps/**", "config/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
report.fail_under = 80

# ==== import-linter (architecture boundaries; run: uv run lint-imports) ====
[tool.importlinter]
root_package = "apps"

[[tool.importlinter.contracts]]
# Inside every app, imports point down only. Leaf modules (constants,
# exceptions, types, adapters, schemas) are unlisted = unconstrained.
name = "Layered app internals"
type = "layers"
# services enqueue tasks (on_commit), so tasks sit BELOW services; task
# bodies stay lean (models/selectors only) - business logic lives in services.
layers = [
  "apis | admin | management",
  "services",
  "tasks",
  "selectors",
  "models",
]
containers = [ "apps.users", "apps.notifications", "apps.payments", "apps.example" ] # append each new app

[[tool.importlinter.contracts]]
# One app = one bounded context; cross-app access via services/selectors
# re-exports only after an explicit decision - never silently.
name = "Domain apps independent"
type = "independence"
modules = [ "apps.users", "apps.notifications", "apps.payments", "apps.example" ] # append each new app
ignore_imports = [
  # Explicit decision (2026-07-12): notifications addresses users - Device/
  # Notification rows belong to a User, delivery reads user.phone/.language.
  # One-way only; users never imports notifications.
  "apps.notifications.** -> apps.users.**",
  # Explicit decision (2026-07-12): payments belongs to a User (payer,
  # wallet owner) and announces outcomes through notifications' service
  # re-exports.
  "apps.payments.** -> apps.users.**",
  "apps.payments.** -> apps.notifications.**",
  # Explicit decision (2026-07-18): signup provisions the wallet -
  # user_post_signup calls payments' wallet_create service re-export, and
  # UserFactory/tests replicate and assert the invariant. Service + test
  # edges only; users' runtime models/selectors never import payments.
  "apps.users.services.users -> apps.payments.services",
  "apps.users.tests.** -> apps.payments.**",
  # The shared fake-value helper is deliberately user-locale-aware; without
  # this, any app's tests importing fake form an indirect chain to users.
  "apps.common.tests.fake -> apps.users.constants",
]

[[tool.importlinter.contracts]]
# apps.common is primitives only. Exemptions: apps/common/tests hosts the
# cross-app gates + factory registry, and seed_db orchestrates seeding across
# every domain app - both reference domain apps by design.
name = "Common imports no domain app"
type = "forbidden"
source_modules = [ "apps.common" ]
forbidden_modules = [ "apps.users", "apps.notifications", "apps.payments", "apps.example" ] # append each new app
ignore_imports = [
  "apps.common.tests.** -> apps.users.**",
  "apps.common.tests.** -> apps.notifications.**",
  "apps.common.tests.** -> apps.payments.**",
  "apps.common.tests.** -> apps.example.**",
  "apps.common.management.commands.seed_db -> apps.users.**",
  "apps.common.management.commands.seed_db -> apps.notifications.**",
  "apps.common.management.commands.seed_db -> apps.payments.**",
  "apps.common.management.commands.seed_db -> apps.example.**",
  # createsu bootstraps the concrete User by design (portable ECS one-off).
  "apps.common.management.commands.createsu -> apps.users.**",
]
unmatched_ignore_imports_alerting = "none"

[project]
name = "backend"
version = "0.1.0"
description = "API-only Django backend scaffold"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Eram Dev Team", email = "eramdevteam@gmail.com" },
]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi>=25.1",
  "dj-database-url>=3.1.2",
  "django>=6.0,<6.1",
  "django-allauth[headless-spec,socialaccount]>=65.18",
  "django-anymail[amazon-ses]>=15.0",
  "django-axes>=8.3.1",
  "django-cors-headers>=4.9",
  "django-guid>=3.6.1",
  "django-health-check>=4.4.3",
  "django-import-export>=4.4.1",
  "django-modeltranslation>=0.20.3",
  "django-ninja>=1.6.2",
  "django-ratelimit>=4.1.0",
  "django-storages[s3]>=1.14.6",
  "django-structlog>=10.1.0",
  "django-tasks-db>=0.12.0",
  "django-unfold>=0.100.0",
  "gunicorn>=26.0",
  "openpyxl>=3.1.5",
  "psycopg[binary,pool]>=3.3.4",
  "pydantic-settings>=2.14.2",
  "sentry-sdk>=2.64",
]

[dependency-groups]
dev = [
  "coverage>=7.15",
  "django-debug-toolbar>=7.0",
  "django-extensions>=4.1",
  "django-stubs[compatible-mypy]>=6.0.6",
  "django-test-migrations>=1.5.0",
  "django-upgrade>=1.31",
  "factory-boy>=3.3.3",
  "import-linter>=2.13",
  "ipdb>=0.13.13",
  "mypy>=2.1",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.12",
  "pytest-mock>=3.15.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15",
  "werkzeug[watchdog]>=3.1.8",
]

# ==== ruff ====
[tool.ruff]
extend-exclude = [
  "*/migrations/*.py",
]
lint.select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "DJ",  # flake8-django
  "C4",  # flake8-comprehensions
  "PIE", # flake8-pie
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "DTZ", # flake8-datetimez (naive datetimes)
  "T20", # flake8-print (no stray prints)
  "PT",  # flake8-pytest-style
  "S",   # flake8-bandit (security)
]
lint.ignore = [
  "RUF012", # ClassVar annotations conflict with Django's class-attr idiom (Meta, admin, etc.)
]
lint.per-file-ignores = { "**/tests/**" = [ "S101" ], "conftest.py" = [ "S101" ], "config/settings/*" = [ "F403", "F405" ] }
lint.isort.force-single-line = true

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
strict = true
files = [ "apps", "config", "manage.py" ]
plugins = [
  "mypy_django_plugin.main",
  "pydantic.mypy",
]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
  # Third-party packages without type stubs / py.typed:
  { module = [ "allauth.*", "health_check.*", "django_ratelimit.*" ], ignore_missing_imports = true },
  # Adapters subclass allauth's untyped base classes:
  { module = "apps.*.adapters", disallow_subclassing_any = false },
  # factory-boy declarations are typed but its callables are not:
  { module = "apps.*.tests.factories", disallow_untyped_calls = false },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
testpaths = [
  "apps",
  "config",
]
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "apps/**", "config/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
report.fail_under = 80
